<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Car Game</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .rules {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
        }
        .rules h2 {
            margin: 8px 0;
            font-size: 20px;
        }
        .blue-text { color: #38bdf8; }
        .red-text { color: #f87171; }

        .car-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        #car-body {
            fill: #ffffff; /* Изначально белая */
            transition: fill 0.5s ease;
        }
        svg {
            width: 85vw;
            max-width: 360px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.8));
            transition: transform 0.2s ease;
        }
        .likes-counter {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            background: #262626;
            padding: 10px 25px;
            border-radius: 30px;
            border: 2px solid #38bdf8;
        }
        #log {
            font-size: 16px;
            color: #a3a3a3;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="rules">
        <h2 class="blue-text">100 лайков — машина станет синей</h2>
        <h2 class="red-text">Роза — машина станет красной</h2>
    </div>

    <div class="car-container">
        <svg id="car-svg" viewBox="0 0 512 250">
            <path id="car-body" d="M475,130 L430,120 L375,55 C365,45 350,40 335,40 L165,40 C145,40 125,50 115,65 L75,115 L30,125 C15,128 10,140 10,155 L10,180 C10,192 20,200 32,200 L65,200 C65,165 92,138 125,138 C158,138 185,165 185,200 L325,200 C325,165 352,138 385,138 C418,138 445,165 445,200 L485,200 C498,200 505,190 505,178 L505,155 C505,142 492,133 475,130 Z"/>
            <path fill="#1e293b" d="M165,58 L245,58 L245,112 L100,112 L132,72 C140,63 152,58 165,58 Z M265,58 L332,58 C342,58 352,62 359,70 L395,112 L265,112 L265,58 Z"/>
            <circle cx="125" cy="200" r="42" fill="#0f172a" stroke="#94a3b8" stroke-width="8"/>
            <circle cx="125" cy="200" r="16" fill="#cbd5e1"/>
            <circle cx="385" cy="200" r="42" fill="#0f172a" stroke="#94a3b8" stroke-width="8"/>
            <circle cx="385" cy="200" r="16" fill="#cbd5e1"/>
            <ellipse cx="488" cy="148" rx="10" ry="6" fill="#fef08a"/>
        </svg>

        <div class="likes-counter">
            Лайки: <span id="likes-num">0</span> / 100
        </div>
    </div>

    <div id="log">Подключение...</div>

    <script>
        const carBody = document.getElementById('car-body');
        const carSvg = document.getElementById('car-svg');
        const likesNum = document.getElementById('likes-num');
        const log = document.getElementById('log');

        let currentLikes = 0;

        function bounceCar() {
            carSvg.style.transform = 'scale(1.08)';
            setTimeout(() => {
                carSvg.style.transform = 'scale(1)';
            }, 200);
        }

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;

        function connect() {
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                log.innerText = 'Готово! Ждем лайки и розы...';
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                if (msg.type === 'gift') {
                    log.innerText = `${msg.sender} отправил: ${msg.giftName}`;
                    if (msg.giftName === 'Rose') {
                        carBody.style.fill = '#ef4444'; // Красная
                        bounceCar();
                    }
                }

                if (msg.type === 'like') {
                    currentLikes += msg.likeCount;
                    likesNum.innerText = currentLikes;

                    if (currentLikes >= 100) {
                        carBody.style.fill = '#3b82f6'; // Синяя
                        bounceCar();
                        log.innerText = 'Набрано 100 лайков! Машина синяя!';
                        currentLikes = 0;
                        setTimeout(() => {
                            likesNum.innerText = currentLikes;
                        }, 1500);
                    }
                }
            };

            ws.onclose = () => {
                log.innerText = 'Переподключение...';
                setTimeout(connect, 3000);
            };
        }

        connect();
    </script>
</body>
</html>
